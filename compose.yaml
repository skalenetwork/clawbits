name: clawbits

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      stalwart:
        condition: service_healthy
      # Ordering only — avatar generation is best-effort, so a slow/absent
      # generator must never block the app from booting.
      dicebear:
        condition: service_started
    environment:
      CLAWBITS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clawbits}:${POSTGRES_PASSWORD:-clawbits}@db:5432/${POSTGRES_DB:-clawbits}
      CLAWBITS_REDIS_URL: ${CLAWBITS_REDIS_URL:-redis://redis:6379/0}
      CLAWBITS_WEB_CONCURRENCY: ${CLAWBITS_WEB_CONCURRENCY:-4}
      # Self-hosted DiceBear avatar generator (see clawbits/avatars/service.py).
      # In-cluster the sidecar is reachable at http://dicebear:3000; the styles
      # path (10.x) must match the image's served version.
      DICEBEAR_BASE: ${DICEBEAR_BASE:-http://dicebear:3000/10.x}
      # dotenvx wiring — APP_ENV picks the env file the container's CMD
      # decrypts; the matching private key is supplied by Komodo / 1Password
      # and never lives on disk. All three keys are forwarded so the same
      # image can serve any env (dev runs flip APP_ENV=development).
      APP_ENV: ${APP_ENV:-production}
      DOTENV_PRIVATE_KEY_DEVELOPMENT: ${DOTENV_PRIVATE_KEY_DEVELOPMENT:-}
      DOTENV_PRIVATE_KEY_STAGING:     ${DOTENV_PRIVATE_KEY_STAGING:-}
      DOTENV_PRIVATE_KEY_PRODUCTION:  ${DOTENV_PRIVATE_KEY_PRODUCTION:-}
      # Fail-closed default: any deploy that doesn't override CLAWBITS_ENV
      # is treated as production. compose.override.yaml flips this to
      # ``development`` for local Docker runs (override is not applied in
      # staging/prod). Dev-auth (clawbits/fastapi/dev_auth.py) refuses to
      # enable unless this is one of {dev, development, local, test}.
      CLAWBITS_ENV: ${CLAWBITS_ENV:-production}
      # Hostnames cleared to serve the LobsterTalk triage LLM over plain http
      # and/or from a private address (a self-hosted Ollama is the case this
      # exists for). Hostnames only — no scheme, no port: the guard matches the
      # host component of the org's base_url. Empty default keeps the
      # https-to-public-addresses-only rule, which is what a shared deployment
      # wants. NB dotenvx `--overload` wins over this, so the key must stay
      # absent from .env.${APP_ENV} for a value set here to survive.
      CLAWBITS_ATTENTION_LLM_ALLOW_HOSTS: ${CLAWBITS_ATTENTION_LLM_ALLOW_HOSTS:-}
      # Output-token cap for one LobsterTalk triage call. Empty keeps the code
      # default (300, triage.py) — plenty for the ~15-token JSON verdict a
      # non-reasoning model emits, but a reasoning model spends the budget
      # thinking and returns empty content, so raise it if you must run one.
      CLAWBITS_ATTENTION_TRIAGE_MAX_TOKENS: ${CLAWBITS_ATTENTION_TRIAGE_MAX_TOKENS:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_BUCKET: ${CLOUDFLARE_BUCKET:-}
      HUMAN_JWT_SECRET: ${HUMAN_JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # All STALWART_* config is supplied by the dotenvx-decrypted .env.${APP_ENV}
      # at container boot (the CMD runs `dotenvx run --overload`). Keeping copies
      # here would be overridden anyway and caused the old localhost/host drift.
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/clawbits/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

  redis:
    image: redis:8.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  dicebear:
    # Self-hosted DiceBear avatar API so avatar generation never depends on the
    # public api.dicebear.com (no rate limits, seeds stay on our infra). The
    # stock image serves v10 styles; the app reaches it at http://dicebear:3000
    # (DICEBEAR_BASE). Stateless, no DB. Pinned tag for reproducible output.
    image: dicebear/api:4.9.0
    restart: unless-stopped
    tmpfs:
      - /run
      - /tmp
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/10.x/glass/svg?seed=health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clawbits}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clawbits}
      POSTGRES_DB: ${POSTGRES_DB:-clawbits}
    volumes:
      # Postgres 18 stores data in /var/lib/postgresql/<version>/docker; mount
      # the parent dir so upgrades can use ``pg_upgrade --link`` in place.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clawbits} -d ${POSTGRES_DB:-clawbits}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  stalwart:
    image: stalwartlabs/stalwart:v0.16.10
    restart: unless-stopped
    environment:
      # v0.16 deterministic admin: with a config.json present the server boots
      # straight into operational mode (no setup wizard) and this env var pins
      # the admin credential (no random password is generated). The value
      # resolves from the dotenvx-decrypted STALWART_SVC_PASSWORD, so the stack
      # MUST be brought up under `dotenvx run -f .env.${APP_ENV} -- docker compose up`
      # (see docs/protocol/EMAIL_REWRITE_PLAN.md). compose.override.yaml pins a
      # fixed value for local dev so dev needs no dotenvx.
      #
      # `:?` fails closed: an unset or empty password would otherwise boot the
      # mail server with a passwordless recovery admin on public ports. NB
      # compose interpolates file-wide, so even `up -d db` needs the var set -
      # `.env` (cp'd from .env.example) or the shell env satisfies it.
      STALWART_RECOVERY_ADMIN: "admin:${STALWART_SVC_PASSWORD:?empty would boot a passwordless mail admin. Set it, or cp .env.example .env for the dev default}"
    # config.json describes only the datastore; everything else (domains,
    # accounts, DKIM, listeners) lives in the data store and is provisioned at
    # runtime via JMAP by the app.
    volumes:
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart_data:/var/lib/stalwart
    # Public mail ports. Management/JMAP (8080) stays internal - the app reaches
    # it over the compose network at http://stalwart:8080. 443 is intentionally
    # not published (the nginx proxy owns the host's 443).
    ports:
      - "25:25"
      - "465:465"
      - "993:993"
    # The image ships a HEALTHCHECK (curl /healthz/live on 443/8080); compose
    # uses it for `condition: service_healthy`. Override only if needed.

volumes:
  pgdata:
  stalwart_data:
