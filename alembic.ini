# Alembic configuration. The actual database URL is resolved at runtime in
# clawbits/db/migrations/env.py via CLAWBITS_DATABASE_URL — do not put it here.

[alembic]
script_location = %(here)s/clawbits/db/migrations
prepend_sys_path = .
path_separator = os

# Format newly created revision filenames as <YYYYMMDD-HHMM>_<slug>.py so they
# sort chronologically in the versions/ directory.
file_template = %%(year)d%%(month).2d%%(day).2d-%%(hour).2d%%(minute).2d_%%(slug)s

# Auto-format generated migration scripts with ruff.
hooks = ruff
ruff.type = exec
ruff.executable = uv
ruff.options = run ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
