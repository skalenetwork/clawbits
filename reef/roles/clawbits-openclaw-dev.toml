# Local OpenClaw → Clawbits on the reef host. Needs reef >= 0.16.
# CLAWBITS_ORG_ID and CLAWBITS_SIGNUP_TOKEN are agent env, not role.
#
#   reef role apply reef/roles/clawbits-openclaw-dev.toml
#   reef agent create --role clawbits-openclaw-dev --name local-claw \
#     --env CLAWBITS_ORG_ID=org-… --env CLAWBITS_SIGNUP_TOKEN=human-…
#   reef agent exec local-claw -- curl -sS -m 2 http://host.microsandbox.internal:8000/api/health
#
# Do not apply on a production host. Prod clawbits ignores this role: its
# CLAWBITS_ENDPOINT is not https://app.clawbits.ai.

version = 1

name  = "clawbits-openclaw-dev"
image = "ghcr.io/skalenetwork/clawbits-openclaw:oc2026.9.6-pl0.19.0-g6bc8f3e"
init  = ["/usr/bin/tini", "-s", "--", "/usr/local/bin/clawbits-start"]

[resources]
vcpus = 4
memory-mib = 6144
disk-gib = 20

[env]
HOME = "/home/node"
XDG_CACHE_HOME = "/home/node/.openclaw/cache"
OPENCLAW_NO_AUTO_UPDATE = "1"
NODE_EXTRA_CA_CERTS = "/.msb/tls/ca.pem"
CLAWBITS_ENDPOINT = "http://host.microsandbox.internal:8000"

[files]
"/etc/openclaw/defaults.json" = '''
{
  "agents": { "defaults": { "model": { "primary": "openrouter/auto" } } },
  "browser": { "extraArgs": ["--ignore-certificate-errors"] },
  "gateway": {
    "controlUi": {
      "allowedOrigins": [
        "http://${REEF_AGENT}.localhost:${REEF_PORT_GATEWAY}",
        "http://127.0.0.1:${REEF_PORT_GATEWAY}"
      ]
    }
  },
  "tools": {
    "sessions": { "visibility": "agent" }
  }
}
'''

[expose]
gateway = 18789
mcp-sandbox = 18790

[volumes]
agents = { dest = "/home/node/.openclaw/agents", size-mib = 4096 }
state = { dest = "/home/node/.openclaw/state", size-mib = 4096 }
workspace = { dest = "/home/node/.openclaw/workspace", size-mib = 10240 }

[network]
egress = ["*"]
host = [8000]

[secrets]
OPENROUTER_API_KEY = { ref = "reef://clawbits-openclaw/openrouter", host = "openrouter.ai" }
