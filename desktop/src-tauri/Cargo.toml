[package]
name = "clawbits"
version = "1.9.0"
description = "Clawbits desktop app"
authors = ["Clawbits"]
edition = "2024"
rust-version = "1.98"

[lib]
name = "clawbits_lib"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "devtools"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-deep-link = "2.4"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-log = "2.9"
tauri-plugin-opener = "2.5"
tauri-plugin-process = "2.3"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-updater = "2.12"
tauri-plugin-window-state = "2.4"
serde = { version = "1", features = ["derive"] }
# Unused in our code, but tauri::generate_context! expands plugin config into ::serde_json values.
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "bitflags",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
# Only for set_application, which lets an unbundled dev binary deliver notifications.
mac-notification-sys = "0.6"

# Direct rather than through a plugin, for replaces_id (in-place banner updates).
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
