worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile       on;
    tcp_nopush     on;
    keepalive_timeout 65;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml image/svg+xml;

    client_max_body_size 25m;

    # Re-resolve upstream container IPs at runtime via Docker's embedded DNS
    # (127.0.0.11) instead of pinning them once at startup. A Komodo deploy
    # rebuilds `app`/`frontend` and recreates those containers with NEW IPs,
    # but leaves this proxy container running (its image/config are unchanged).
    # With a static `upstream {}` block nginx would keep proxying to the dead
    # pre-deploy IPs → 502 until a manual restart. Putting the host in a
    # variable below makes proxy_pass dynamic, so nginx re-resolves (valid=10s)
    # and self-heals within seconds of the new container coming up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket upgrade support. Maps the client's Upgrade header to the correct
    # Connection value ("upgrade" for a WS handshake, "close" otherwise) so the
    # /api/ proxy can carry a WebSocket through to the app. Without this the agent
    # events WebSocket (/api/agentic/mm/events/ws) arrives at uvicorn as plain HTTP
    # — the WS-only route 404s, no agent socket subscribes, and the server-side
    # LobsterTalk attention gate's nudges all drop as "no live subscriber".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Plain HTTP: redirect everything to HTTPS. Cloudflare's "Always Use HTTPS"
    # normally handles this at the edge; this is defense in depth for direct hits.
    server {
        listen      80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen              443 ssl;
        http2               on;
        server_name         _;

        ssl_certificate     /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # The debug trace surface is development-only and is gated in the app
        # as well (see clawbits/fastapi/trace_endpoints.py). Belt-and-braces at
        # the edge so a deploy with a misconfigured CLAWBITS_ENV still can't
        # expose it. JSON body so a probe sees the same content-type as any
        # other API 404 — the app's own envelope carries extra fields nginx
        # can't reproduce without risking malformed JSON on a quoted $uri.
        # Deliberately NOT in nginx.dev.conf — dev needs the surface.
        location ^~ /api/trace/ {
            default_type application/json;
            return 404 '{"detail":"Not Found"}';
        }

        location /api/ {
            # Variable forces per-request DNS re-resolution (see resolver above).
            set                $app_target app:8000;
            proxy_pass         http://$app_target;
            proxy_http_version 1.1;
            # Carry WebSocket handshakes through to the app (agent events WS at
            # /api/agentic/mm/events/ws). Harmless for regular REST: for a normal
            # request $http_upgrade is empty, so Connection resolves to "close".
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Cloudflare adds CF-IPCountry on every proxied request. nginx forwards
            # client headers by default, but state it explicitly so the region-gate
            # in /api/public/config keeps working if header rewriting is added later.
            proxy_set_header   CF-IPCountry      $http_cf_ipcountry;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location / {
            set                $frontend_target frontend:80;
            proxy_pass         http://$frontend_target;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }
}
