worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile       on;
    tcp_nopush     on;
    keepalive_timeout 65;

    client_max_body_size 25m;

    # Re-resolve container IPs at runtime via Docker's embedded DNS so a
    # rebuilt app/frontend container (new IP) doesn't strand the proxy. See
    # nginx.conf for the full rationale; kept identical here for dev parity.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket upgrade support — carries the agent events WebSocket
    # (/api/agentic/mm/events/ws) through to the app; without it the upgrade is
    # stripped and LobsterTalk attention nudges never reach agents. See nginx.conf.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen      80 default_server;
        server_name _;

        location /api/ {
            set                $app_target app:8000;
            proxy_pass         http://$app_target;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location / {
            set                $frontend_target frontend:80;
            proxy_pass         http://$frontend_target;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }
}
