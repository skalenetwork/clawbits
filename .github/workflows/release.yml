name: Release

# release-please keeps one release PR per lane. Merging one tags it and creates its
# GitHub release; the jobs below then publish that lane's artifacts onto it. A manual
# run republishes the plugin and CLI at their current versions; every step is
# idempotent.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Never cancel a publish in flight. A dropped middle run is harmless: release-please
# recomputes from the repo state on the next one.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plugin: ${{ steps.rp.outputs['plugin--release_created'] == 'true' || github.event_name == 'workflow_dispatch' }}
      cli: ${{ steps.rp.outputs['cli--release_created'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # tauri.conf.json bakes releases/latest/download/latest.json into every desktop
      # binary ever shipped, so "Latest" must stay on a desktop release. release-please
      # cannot opt out of make_latest, and un-latesting alone hands the pointer to the
      # next-newest release, so the desktop release claims it back explicitly.
      - name: Return "Latest" to the desktop release
        if: steps.rp.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          desktop=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.tagName | startswith("desktop-")) | select(.isDraft == false and .isPrerelease == false)][0].tagName // empty')
          if [ -z "$desktop" ]; then
            echo "::warning::no published desktop release to hold Latest"
            exit 0
          fi
          gh release edit "$desktop" --latest

  plugin:
    name: Publish plugin
    needs: release-please
    if: needs.release-please.outputs.plugin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # node, not the runner default: staging and validation shell out to it, and
      # dist/tools-entry.js needs AbortSignal.any (Node >= 20.3).
      - uses: ./.github/actions/setup-bun
        with:
          workspace: plugin
          node-version: '24'

      - name: Typecheck, test, build
        working-directory: plugin
        run: |
          set -euo pipefail
          bun --bun run typecheck
          bun run test
          bun --bun run build
          echo "VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"

      # release-please writes each manifest's top-level version but not the nested
      # `openclaw.version`, which the plugin sends as X-Clawbits-Plugin-Version and
      # version_check.py compares against package.json: they must match exactly.
      - name: Stamp every manifest with the release version
        working-directory: plugin
        run: |
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          for (const path of ['package.json', 'openclaw.plugin.json', 'package.tools.json', 'openclaw.tools.plugin.json']) {
            const json = JSON.parse(fs.readFileSync(path, 'utf8'));
            json.version = version;
            if (json.openclaw?.version) json.openclaw.version = version;
            fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
          }
          NODE

      - name: Stage artifacts
        working-directory: plugin
        run: |
          set -euo pipefail
          tools=../publish/clawbits-openclaw-tools
          channel=../publish/clawbits-openclaw-plugin
          node stage-tools.mjs "$tools"
          node stage-channel.mjs "$channel"
          test ! -e "$tools/src" && test ! -e "$tools/dist/index.js" && test ! -e "$tools/dist/gateway-adapter.js" && test -e "$tools/skills"
          test ! -e "$channel/src" && test ! -e "$channel/skills" && test ! -e "$channel/dist/tools-entry.js"
          node - "$tools" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.argv[2];
          const pkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'openclaw.plugin.json'), 'utf8'));
          const entry = './dist/tools-entry.js';
          if (pkg.name !== 'clawbits-openclaw-tools' || pkg.openclaw?.id !== 'clawbits-tools') throw new Error('wrong tools package identity');
          if (pkg.openclaw?.extensions?.length !== 1 || pkg.openclaw.extensions[0] !== entry) throw new Error(`tools must load only ${entry}`);
          if (!fs.existsSync(path.join(root, entry))) throw new Error('compiled tools entry missing');
          const tools = manifest.contracts?.tools || [];
          if (tools.length === 0) throw new Error('manifest declares no tools');
          for (const name of tools) if (manifest.toolMetadata?.[name]?.optional !== true) throw new Error(`tool ${name} must be optional`);
          NODE

      # Load both artifacts on the oldest OpenClaw they claim (the compat floor) and on
      # the SDK they were built against, so a false compatibility claim fails here.
      - name: Validate against the compat floor and the build SDK
        run: |
          set -euo pipefail
          for pair in tools:clawbits-openclaw-tools channel:clawbits-openclaw-plugin; do
            kind=${pair%%:*} pkg=${pair#*:}
            root="$(mktemp -d)"
            cp -R "publish/$pkg" "$root/plugin"
            pushd "$root/plugin" >/dev/null
            node -p "const o=require('./package.json').openclaw; [...new Set([o.compat.minGatewayVersion, o.build.openclawVersion])].join('\n')" |
              while read -r sdk; do
                echo "::group::$pkg on openclaw@$sdk"
                rm -rf node_modules
                npm install --ignore-scripts --no-audit --no-fund --package-lock=false --no-save "openclaw@$sdk"
                node "$GITHUB_WORKSPACE/plugin/validate-artifact.mjs" "$kind" .
                echo "::endgroup::"
              done
            popd >/dev/null
          done

      - name: Attach tarballs to the release
        run: |
          set -euo pipefail
          for pkg in clawbits-openclaw-tools clawbits-openclaw-plugin; do
            tar -czf "$pkg-$VERSION.tgz" -C publish "$pkg"
          done
          gh release upload "openclaw-plugin-v$VERSION" clawbits-openclaw-*-"$VERSION".tgz --clobber

      # Tools first: an agent installs them before upgrading the channel plugin. A
      # client-side timeout can retry a publish that already succeeded and exit 1 on
      # "already exists", so a failure only counts if our version is not on ClawHub.
      - name: Publish to ClawHub
        env:
          CLAWHUB_API_TOKEN: ${{ secrets.CLAWHUB_API_TOKEN }}
        run: |
          set -uo pipefail
          bunx --bun clawhub@latest login --token "$CLAWHUB_API_TOKEN" --no-browser || exit 1
          published() {
            curl -fsS "https://clawhub.ai/api/v1/packages/$1/versions" \
              | jq -e --arg v "$VERSION" '[.items[]?.version] | index($v)' >/dev/null
          }
          for pkg in clawbits-openclaw-tools clawbits-openclaw-plugin; do
            published "$pkg" && { echo "$pkg@$VERSION already on ClawHub"; continue; }
            bunx --bun clawhub@latest package publish "publish/$pkg" \
              --family code-plugin \
              --source-repo "$GITHUB_REPOSITORY" \
              --source-commit "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              || published "$pkg" \
              || { echo "::error::$pkg@$VERSION failed to publish"; exit 1; }
          done

  cli:
    name: CLI (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-26 }
          - { target: x86_64-apple-darwin, runner: macos-26 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}
      - name: Build and attach to the release
        working-directory: cli
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          cargo build --release --target "$TARGET"
          name="clawbits-cli-v$version-$TARGET"
          mkdir -p "stage/$name"
          cp "target/$TARGET/release/cbs" ../LICENSE README.md "stage/$name/"
          tar -C stage -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "cli-v$version" "$name.tar.gz" "$name.tar.gz.sha256" --clobber
