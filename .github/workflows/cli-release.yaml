name: CLI Release

# Release pipeline for the `cbs` terminal client in cli/. Runs only on a push
# to main touching cli/** (or a manual dispatch) — never on pull requests, so
# none of these jobs show up (even as "Skipped") in a PR's checks. The PR gate
# is the `rust` matrix in ci.yml; the `check` job here re-runs the same
# fmt/clippy/tests before publishing, because a direct push to main would
# otherwise skip them.
#
# Publishes release binaries for four targets to a GitHub Release ON THIS
# REPO, tagged `cli-v<version>`. That tag prefix keeps it clear of `v*`,
# `desktop-v*` and the plugin tags.
#
# `--latest=false` is MANDATORY here and everywhere except the desktop release:
# desktop/src-tauri/tauri.conf.json bakes
# releases/latest/download/latest.json into every shipped binary, so a CLI
# release that took "Latest" would 404 the updater for every installed desktop
# app.
#
# The version is read from cli/Cargo.toml, which release-please writes
# (release-please-config.json, the `cli` package). Re-running the same commit
# yields the same version and hits the skip-if-exists guard; the `force`
# dispatch input re-uploads that version's assets.
#
# Linux runners are PINNED, never ubuntu-latest: binaries link the runner's
# glibc, so the image sets the compatibility floor and `latest` would move it
# on every runner-image bump. ubuntu-24.04 (glibc 2.39) is that floor now;
# 22.04 held it at 2.35 until GitHub deprecated the image. The raise drops
# Ubuntu 22.04, Debian 12 and RHEL 9 hosts. Fully-static musl builds would
# remove the floor entirely but need a musl cross toolchain for ring's C.
on:
  push:
    branches: [main]
    paths:
      - cli/**
      - .github/workflows/cli-release.yaml
  workflow_dispatch:
    inputs:
      force:
        description: Re-upload assets even if this version's release already exists
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Format
        working-directory: cli
        run: cargo fmt --check

      - name: Clippy
        working-directory: cli
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: cli
        run: cargo test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-26
          # Cross-compiled from the arm runner — the Apple toolchain carries
          # both architectures, so no Intel runner (deprecating anyway).
          - target: x86_64-apple-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          persist-credentials: false

      - name: Install Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}

      # Cargo.toml already carries the release version: release-please writes it
      # (release-please-config.json, the `cli` package). The step that used to be
      # here rewrote it in the CI checkout as `<major.minor>.<commits touching
      # cli/>`, which is not monotonic — `git rev-list --count` resets under
      # squash-merge, now the only merge mode in this repo, and had already
      # drifted below the released cli-v0.1.2.
      - name: Read version
        working-directory: cli
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version = ${version}"
          echo "STAMP_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        working-directory: cli
        run: |
          set -euo pipefail
          name="clawbits-cli-v${STAMP_VERSION}-${{ matrix.target }}"
          mkdir -p "stage/${name}"
          cp "target/${{ matrix.target }}/release/cbs" "stage/${name}/"
          cp ../LICENSE README.md "stage/${name}/"
          tar -C stage -czf "${name}.tar.gz" "${name}"
          tar -tzf "${name}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: cli/clawbits-cli-v*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      # Creates the `cli-v*` tag + release on this repo. The default
      # GITHUB_TOKEN suffices — no cross-repo secret, unlike the plugin
      # mirrors.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Shallow is enough now that the version comes out of Cargo.toml
          # instead of counting commits.
          persist-credentials: false

      - name: Resolve release tag
        id: meta
        working-directory: cli
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=cli-v$version" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum clawbits-cli-v*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$FORCE" != "true" ]; then
              echo "::notice::Release $TAG already exists (this commit's auto version is already published) — push another cli/ change to publish a new version, or dispatch with force=true to re-upload. Skipping."
              exit 0
            fi
            echo "force=true: re-uploading assets to existing release $TAG"
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          # --latest=false so a CLI release never displaces the product
          # release as the repo's "Latest"; the `cli-v*` prefix keeps it
          # clear of `v*` / `desktop-v*` / the plugin tags.
          gh release create "$TAG" \
            --latest=false \
            --title "clawbits CLI v$VERSION" \
            --notes "Terminal client for the Clawbits human messaging API. The binary is \`cbs\` — Linux (x86_64/arm64, glibc ≥ 2.35) and macOS (arm64/x86_64).

          Install:
          \`\`\`bash
          tar -xzf clawbits-cli-v${VERSION}-<target>.tar.gz
          install -m 755 clawbits-cli-v${VERSION}-<target>/cbs ~/.local/bin/
          cbs login --email you@example.com
          \`\`\`

          Verify with \`sha256sum -c SHA256SUMS\`. Docs: [cli/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/cli/README.md)." \
            dist/*
