name: Web

# Marketing site (web/) -> Cloudflare Workers static assets.
#
#   prod  -> clawbits-web  -> https://clawbits.ai
#
# `prod` advances by manual merge from `main`, matching how the app ships. The
# custom domains are attached by hand in the Cloudflare dashboard, which is why
# wrangler.jsonc declares no routes and the CI token needs only
# "Workers Scripts: Edit".
#
# `main`, pull requests and manual dispatches build and verify the same
# production artifact but never deploy.

on:
  push:
    branches: [main, prod]
    # The site does not build from web/ alone. /changelog reads
    # frontend/src/release-notes (content.config.ts) and /docs reads docs/
    # through the src/docs-allowlist.ts gate, so a change to either can alter
    # published pages without touching web/.
    #
    # Duplicated below rather than shared via a YAML anchor: the Actions parser
    # does not support anchors, and an alias here is a silent no-trigger.
    paths:
      - 'web/**'
      - 'frontend/src/release-notes/**'
      - 'docs/**'
      - '.github/workflows/web.yaml'
  pull_request:
    # Scoped to base `main`. The main->prod promotion PR carries a SHA that
    # already built green on main, so building it again was pure duplication.
    branches: [main]
    paths:
      - 'web/**'
      - 'frontend/src/release-notes/**'
      - 'docs/**'
      - '.github/workflows/web.yaml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy per branch at a time - two overlapping `wrangler deploy` runs
# against the same Worker race on which upload wins. PR builds are safe to
# cancel; a deploy in flight is not.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full checkout, NOT sparse: the build reads ../frontend and ../docs
          # (see the paths filter above).

      # Node is pinned, unlike frontend/ which uses `bun --bun`. Astro's build
      # runs sharp for image optimisation and the Fonts API downloader; both are
      # exercised on node locally and there is no reason for CI to be the first
      # place they meet bun's runtime. package.json engines requires >=22.12, so
      # the runner's default node is not assumed either.
      - uses: ./.github/actions/setup-bun
        with:
          workspace: web
          node-version: '24'

      - name: Build
        env:
          # Canonical URLs, the sitemap, absolute OG image URLs and the
          # Sitemap: line in robots.txt are all built from this.
          SITE_URL: https://clawbits.ai
        run: bun run build

      - name: Verify
        # astro check + legal parity + internal links. Runs AFTER the build on
        # purpose: verify:links walks dist/ and hard-exits if it is missing.
        run: bun run verify

      - name: Assert the production build is indexable
        # clawbits.ai is the ONLY indexable origin (owner decision 2026-08-10;
        # src/pages/robots.txt.ts INDEXABLE_HOSTS). A de-indexed apex ships a
        # dark launch with CI green, so check robots.txt and the canonical.
        run: |
          if grep -qx 'Disallow: /' dist/robots.txt; then
            echo "::error::robots.txt de-indexes the production apex"
            cat dist/robots.txt; exit 1
          fi
          canonical="$(grep -o 'rel="canonical" href="[^"]*"' dist/index.html | head -1 | sed -E 's#.*href="([^"]*)".*#\1#')"
          case "$canonical" in
            https://clawbits.ai/*|https://clawbits.ai) ;;
            *) echo "::error::canonical '$canonical' is not on https://clawbits.ai"; exit 1 ;;
          esac

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/prod'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # bunx resolves the wrangler pinned in web/package.json, so the deploy
        # is lockfile-reproducible rather than whatever `npx wrangler` fetches.
        # --env is mandatory: without it wrangler deploys the unnamed top-level
        # config as another Worker. See wrangler.jsonc.
        run: bunx wrangler deploy --env production

      - name: Summary
        if: github.ref == 'refs/heads/prod'
        run: echo "Deployed \`production\` -> https://clawbits.ai" >> "$GITHUB_STEP_SUMMARY"
