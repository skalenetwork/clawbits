name: Publish ClawBits Plugin to ClawHub

# Plugin releases are tag-driven, the same way the rest of the repo works
# (see release.yaml / desktop-release.yml): the version is NOT a hand-bumped
# source-of-truth in plugin/package.json. Instead, on a push to main that
# touches plugin/**, this workflow:
#
#   1. tests + typechecks plugin/.
#   2. runs semantic-release from plugin/ against THIS repo, so the plugin's
#      version tag (plugin-v<version>) and GitHub Release are created here.
#      plugin/.releaserc.json extends `semantic-release-monorepo`, which scopes
#      commit analysis and release notes to commits touching plugin/. Without
#      it commit-analyzer would read the whole monorepo history and a backend
#      `feat:` would bump the plugin.
#   3. only if semantic-release cut a new version, stamps that version into the
#      published artifact and publishes it to ClawHub.
#
# Tag namespaces are kept apart on purpose: repo-wide releases use `v*`
# (.releaserc.json), the desktop app uses `desktop-v*`, the plugin uses
# `plugin-v*`. Nothing collides.
#
# No version is committed back, so there is no recursive release loop (same
# reason the repo-wide semantic-release in release.yaml has none): the trigger
# is scoped to plugin/**, and semantic-release only creates a tag and a GitHub
# Release, never a commit.
#
# A push that doesn't touch plugin/** never starts this workflow; a plugin
# change whose commits don't warrant a release (per .releaserc rules) is
# tested but not published.
#
# Manual dispatch runs the same flow, but semantic-release only cuts a
# release from the `main` branch (per plugin/.releaserc.json `branches`), so a
# dispatch from another ref tests without publishing.
#
# Plugin tests run inline here so this stays the only thing that exercises the
# plugin on main (workflow.yaml skips its plugin job on push-to-main).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plugin/**'

permissions:
  contents: write # semantic-release creates the plugin-v* tag + GitHub Release on this repo

concurrency:
  group: publish-clawbits-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-plugin:
    name: Publish plugin
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install plugin dependencies
        working-directory: plugin
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: plugin
        run: bun --bun run typecheck

      - name: Run plugin tests
        working-directory: plugin
        run: bun run test

      - name: Semantic release (plugin-v* tag + GitHub Release on this repo)
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: plugin
          # semantic-release-monorepo is a shareable config (referenced from
          # plugin/.releaserc.json `extends`) and still has to be installed
          # here. It overrides analyzeCommits/generateNotes so only commits
          # touching plugin/ count toward the plugin's version and notes.
          extra_plugins: semantic-release-monorepo
        env:
          # Tag + release land on this repo now, so the built-in token is enough
          # — no PLUGIN_MIRROR_TOKEN in the plugin release path.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp released version into the artifact
        if: steps.semrel.outputs.new_release_published == 'true'
        working-directory: plugin
        env:
          VERSION: ${{ steps.semrel.outputs.new_release_version }}
        run: |
          bun run - <<'BUN'
          const fs = require('node:fs');
          const v = process.env.VERSION;
          function rewrite(p) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = v;
            if (j.openclaw && j.openclaw.version) j.openclaw.version = v;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          }
          rewrite('package.json');
          rewrite('openclaw.plugin.json');
          console.log(`Stamped plugin artifact version ${v}`);
          BUN

      - name: Build plugin
        if: steps.semrel.outputs.new_release_published == 'true'
        working-directory: plugin
        run: bun --bun run build

      - name: Stage publish directory
        id: pack
        if: steps.semrel.outputs.new_release_published == 'true'
        working-directory: plugin
        run: |
          rm -rf ../publish/clawbits-openclaw-plugin
          mkdir -p ../publish/clawbits-openclaw-plugin
          cp -r dist src docs skills openclaw.plugin.json clawbits.config.example.json package.json ../publish/clawbits-openclaw-plugin/
          echo "publish_path=publish/clawbits-openclaw-plugin" >> "$GITHUB_OUTPUT"

      # clawhub is invoked via `bunx --bun` rather than a global install:
      # the package's bin has a `#!/usr/bin/env node` shebang, so a global
      # symlink would still need node on PATH. `bunx --bun` forces bun's
      # runtime instead. clawhub stores auth state in $HOME, so login state
      # persists across the calls below.
      - name: Authenticate ClawHub CLI
        if: steps.semrel.outputs.new_release_published == 'true'
        env:
          CLAWHUB_API_TOKEN: ${{ secrets.CLAWHUB_API_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_API_TOKEN" ]; then
            echo "::error::Missing required secret CLAWHUB_API_TOKEN"
            exit 1
          fi
          bunx --bun clawhub@latest login --token "$CLAWHUB_API_TOKEN" --no-browser

      - name: Verify ClawHub authentication
        if: steps.semrel.outputs.new_release_published == 'true'
        run: bunx --bun clawhub@latest whoami

      - name: Publish package to ClawHub
        if: steps.semrel.outputs.new_release_published == 'true'
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ steps.semrel.outputs.new_release_version }}
        run: |
          bunx --bun clawhub@latest package publish "${{ steps.pack.outputs.publish_path }}" \
            --family code-plugin \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "refs/tags/plugin-v${VERSION}"
