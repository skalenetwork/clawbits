name: Publish ClawBits Plugin to ClawHub

# Plugin releases are automatic and message-agnostic, the same way the IronClaw
# channel works (see publish-ironclaw-channel.yaml). On a push to main that
# touches plugin/**, this workflow:
#
#   1. tests + typechecks plugin/.
#   2. stamps a version: major.minor is hand-controlled in plugin/package.json,
#      the patch is the count of commits touching plugin/. Every plugin change
#      therefore ships a fresh, unique, monotonic version with no manual bump
#      and no dependency on commit-message format. Deterministic + idempotent:
#      the same commit always yields the same version, and a re-run hits the
#      skip-if-published guard below. Stamped into the CI checkout only, never
#      committed back, so there is no recursive release loop.
#   3. publishes the staged artifact to ClawHub, unless that version is already
#      on the registry.
#
# Bump major/minor by hand in plugin/package.json + plugin/openclaw.plugin.json
# only for a deliberate semantic jump; the patch takes care of itself.
#
# ClawHub is the registry of record for the plugin — no git tag or GitHub
# Release is cut here, and the published package carries the real commit SHA as
# its provenance, so any version is traceable back to a commit.
#
# A push that doesn't touch plugin/** never starts this workflow. Manual
# dispatch from any ref runs the same flow, but only main publishes.
#
# Plugin tests run inline here so this stays the only thing that exercises the
# plugin on main (workflow.yaml skips its plugin job on push-to-main).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'plugin/**'

permissions:
  contents: read

concurrency:
  group: publish-clawbits-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-plugin:
    name: Publish plugin
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v6
        with:
          # Full history so "Stamp auto version" can count commits touching plugin/.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install plugin dependencies
        working-directory: plugin
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: plugin
        run: bun --bun run typecheck

      - name: Run plugin tests
        working-directory: plugin
        run: bun run test

      - name: Stamp auto version (patch = commit count)
        id: version
        working-directory: plugin
        run: |
          set -euo pipefail
          base="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version.split('.').slice(0,2).join('.')")"
          patch="$(git rev-list --count HEAD -- .)"
          version="${base}.${patch}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $version"
          node - "$version" <<'NODE'
          const fs = require('node:fs');
          const v = process.argv[2];
          function rewrite(p) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = v;
            if (j.openclaw && j.openclaw.version) j.openclaw.version = v;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          }
          rewrite('package.json');
          rewrite('openclaw.plugin.json');
          console.log(`Stamped plugin artifact version ${v}`);
          NODE

      # Two independent reasons not to publish, resolved into one output so the
      # publish steps below share a single condition:
      #   1. not on main — a workflow_dispatch from a feature branch would
      #      otherwise compute a version off that branch's commit count and ship
      #      it to ClawHub as a real release. Dispatch elsewhere tests + stages
      #      only. (The push trigger is already main-only.)
      #   2. the version is already on the registry — makes re-runs idempotent.
      - name: Decide whether to publish
        id: guard
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ref ${{ github.ref_name }} is not main; testing and staging only, nothing will be published."
            exit 0
          fi
          versions_json="$(curl -fsS "https://clawhub.ai/api/v1/packages/clawbits-openclaw-plugin/versions" 2>/dev/null || true)"
          already=false
          if [ -n "$versions_json" ]; then
            already="$(node -e "
              const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const versions = (data.items || []).map(x => x.version);
              console.log(versions.includes(process.argv[1]) ? 'true' : 'false');
            " "$VERSION" <<<"$versions_json")"
          fi
          if [ "$already" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is already on the registry; skipping publish. It will bump on the next commit touching plugin/."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish $VERSION"
          fi

      - name: Build plugin
        if: steps.guard.outputs.publish == 'true'
        working-directory: plugin
        run: bun --bun run build

      - name: Stage publish directory
        id: pack
        if: steps.guard.outputs.publish == 'true'
        working-directory: plugin
        run: |
          rm -rf ../publish/clawbits-openclaw-plugin
          mkdir -p ../publish/clawbits-openclaw-plugin
          cp -r dist src docs skills openclaw.plugin.json clawbits.config.example.json package.json ../publish/clawbits-openclaw-plugin/
          echo "publish_path=publish/clawbits-openclaw-plugin" >> "$GITHUB_OUTPUT"

      # clawhub is invoked via `bunx --bun` rather than a global install:
      # the package's bin has a `#!/usr/bin/env node` shebang, so a global
      # symlink would still need node on PATH. `bunx --bun` forces bun's
      # runtime instead. clawhub stores auth state in $HOME, so login state
      # persists across the calls below.
      - name: Authenticate ClawHub CLI
        if: steps.guard.outputs.publish == 'true'
        env:
          CLAWHUB_API_TOKEN: ${{ secrets.CLAWHUB_API_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_API_TOKEN" ]; then
            echo "::error::Missing required secret CLAWHUB_API_TOKEN"
            exit 1
          fi
          bunx --bun clawhub@latest login --token "$CLAWHUB_API_TOKEN" --no-browser

      - name: Verify ClawHub authentication
        if: steps.guard.outputs.publish == 'true'
        run: bunx --bun clawhub@latest whoami

      - name: Publish package to ClawHub
        if: steps.guard.outputs.publish == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          bunx --bun clawhub@latest package publish "${{ steps.pack.outputs.publish_path }}" \
            --family code-plugin \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref }}"
