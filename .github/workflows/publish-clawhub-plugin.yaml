name: Publish ClawBits Plugin to ClawHub

# Ordered second half of the coordinated Clawbits release. The companion
# workflow builds, validates, and publishes first. Normally its successful
# completion starts this channel release for the exact same commit. Manual
# dispatch is a recovery path and still requires the matching companion.
#
#   1. tests + typechecks plugin/.
#   2. stamps a version: major.minor is hand-controlled in plugin/package.json,
#      the patch is the count of commits touching plugin/. Every plugin change
#      therefore ships a fresh, unique, monotonic version with no manual bump
#      and no dependency on commit-message format. Deterministic + idempotent:
#      the same commit always yields the same version, and a re-run hits the
#      skip-if-published guard below. Stamped into the CI checkout only, never
#      committed back, so there is no recursive release loop.
#   3. publishes the staged artifact to ClawHub, unless that version is already
#      on the registry.
#
# Bump major/minor by hand in plugin/package.json + plugin/openclaw.plugin.json
# only for a deliberate semantic jump; the patch takes care of itself.
#
# Both the GitHub release artifact and ClawHub package carry the source commit
# provenance. No files are stamped or committed back to the branch.
#
on:
  # Recovery paths: publish only the channel when the matching companion
  # version already exists but the automatic handoff was cancelled/failed.
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish Clawbits OpenClaw Tools to ClawHub
    types:
      - completed

permissions:
  contents: write # "Publish GitHub Release" creates the openclaw-plugin-v* tag + release on this repo

concurrency:
  group: publish-clawbits-channel-main
  cancel-in-progress: false

jobs:
  publish-plugin:
    name: Publish plugin
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      SOURCE_REF: ${{ github.event_name == 'workflow_run' && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v7
        with:
          # Full history so "Stamp auto version" can count commits touching plugin/.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install plugin dependencies
        working-directory: plugin
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: plugin
        run: bun --bun run typecheck

      - name: Run plugin tests
        working-directory: plugin
        run: bun run test

      - name: Stamp auto version (patch = commit count)
        id: version
        working-directory: plugin
        run: |
          set -euo pipefail
          base="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version.split('.').slice(0,2).join('.')")"
          patch="$(git rev-list --count HEAD -- .)"
          version="${base}.${patch}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $version"
          node - "$version" <<'NODE'
          const fs = require('node:fs');
          const v = process.argv[2];
          function rewrite(p) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = v;
            if (j.openclaw && j.openclaw.version) j.openclaw.version = v;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          }
          rewrite('package.json');
          rewrite('openclaw.plugin.json');
          console.log(`Stamped plugin artifact version ${v}`);
          NODE

      # Two independent reasons not to publish, resolved into one output so the
      # publish steps below share a single condition:
      #   1. not on main — a workflow_dispatch from a feature branch would
      #      otherwise compute a version off that branch's commit count and ship
      #      it to ClawHub as a real release. Dispatch elsewhere tests + stages
      #      only.
      #   2. the version is already on the registry — makes re-runs idempotent.
      - name: Decide whether to publish
        id: guard
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_BRANCH" != "main" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Source branch $SOURCE_BRANCH is not main; testing and staging only, nothing will be published."
            exit 0
          fi
          tools_versions="$(curl -fsS "https://clawhub.ai/api/v1/packages/clawbits-openclaw-tools/versions" 2>/dev/null || true)"
          if [ -z "$tools_versions" ] || ! node -e '
            const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (!(data.items || []).some((item) => item.version === process.argv[1])) process.exit(1);
          ' "$VERSION" <<<"$tools_versions"; then
            echo "::error::Matching companion version $VERSION is not verified on ClawHub; refusing channel publish."
            exit 1
          fi
          versions_json="$(curl -fsS "https://clawhub.ai/api/v1/packages/clawbits-openclaw-plugin/versions" 2>/dev/null || true)"
          already=false
          if [ -n "$versions_json" ]; then
            already="$(node -e "
              const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const versions = (data.items || []).map(x => x.version);
              console.log(versions.includes(process.argv[1]) ? 'true' : 'false');
            " "$VERSION" <<<"$versions_json")"
          fi
          if [ "$already" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is already on the registry; skipping publish. It will bump on the next commit touching plugin/."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Will publish $VERSION"
          fi

      - name: Build plugin
        if: steps.guard.outputs.publish == 'true'
        working-directory: plugin
        run: bun --bun run build

      - name: Stage publish directory
        id: pack
        if: steps.guard.outputs.publish == 'true'
        working-directory: plugin
        run: |
          set -euo pipefail
          staged=../publish/clawbits-openclaw-plugin
          node stage-channel.mjs "$staged"
          test ! -e "$staged/src"
          test ! -e "$staged/skills"
          test ! -e "$staged/dist/tools-entry.js"
          echo "publish_path=publish/clawbits-openclaw-plugin" >> "$GITHUB_OUTPUT"

      - name: Validate staged artifact against the floor and pinned OpenClaw SDKs
        if: steps.guard.outputs.publish == 'true'
        run: |
          set -euo pipefail
          validation_root="$(mktemp -d)"
          trap 'rm -rf "$validation_root"' EXIT
          cp -R "${{ steps.pack.outputs.publish_path }}" "$validation_root/plugin"
          cd "$validation_root/plugin"
          sdk_versions="$(node -p "const o=require('./package.json').openclaw; [...new Set([o.compat.minGatewayVersion, o.build.openclawVersion])].join('\\n')")"
          while read -r sdk_version; do
            [ -n "$sdk_version" ] || continue
            echo "::group::openclaw@${sdk_version}"
            rm -rf node_modules
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false --no-save \
              "openclaw@${sdk_version}"
            # The CLI validator is defineToolPlugin-only. Importing executes
            # defineChannelPluginEntry against this exact host SDK.
            node "$GITHUB_WORKSPACE/plugin/validate-artifact.mjs" channel .
            echo "::endgroup::"
          done <<< "$sdk_versions"

      # The GitHub Release is cut BEFORE the ClawHub publish on purpose: the two
      # are independent distribution channels, so a registry-side failure (auth,
      # ownership, outage) still leaves an installable tarball on the release.
      # Both steps are individually idempotent, so a re-run converges — whichever
      # of the two already succeeded is skipped.
      - name: Package release tarball
        id: tarball
        if: steps.guard.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          asset="clawbits-openclaw-plugin-${VERSION}.tgz"
          tar -czf "$asset" -C publish clawbits-openclaw-plugin
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          ls -lh "$asset"

      - name: Publish GitHub Release
        if: steps.guard.outputs.publish == 'true'
        env:
          # Tag + release land on this repo, so the built-in token suffices
          # (permissions: contents: write above).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.tarball.outputs.asset }}
        run: |
          set -euo pipefail
          TAG="openclaw-plugin-v${VERSION}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; skipping creation and re-uploading the asset."
          else
            # --latest=false so a plugin release never displaces the repo's own
            # v* release as GitHub's "Latest"; the `openclaw-plugin-v*` prefix
            # also keeps it clear of `v*` (.releaserc.json), `desktop-v*`, and
            # `ironclaw-channel-v*`.
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --latest=false \
              --target "$SOURCE_SHA" \
              --title "Clawbits OpenClaw plugin v$VERSION" \
              --notes "OpenClaw channel plugin bridging an agent to its Clawbits organization.

          Install from ClawHub:
          \`\`\`
          openclaw plugins install clawhub:clawbits-openclaw-plugin --pin
          \`\`\`
          Or install the attached tarball directly: extract it and run \`openclaw plugins install <dir>\`."
          fi
          gh release upload "$TAG" "$ASSET" --repo "${{ github.repository }}" --clobber

      # clawhub is invoked via `bunx --bun` rather than a global install:
      # the package's bin has a `#!/usr/bin/env node` shebang, so a global
      # symlink would still need node on PATH. `bunx --bun` forces bun's
      # runtime instead. clawhub stores auth state in $HOME, so login state
      # persists across the calls below.
      - name: Authenticate ClawHub CLI
        if: steps.guard.outputs.publish == 'true'
        env:
          CLAWHUB_API_TOKEN: ${{ secrets.CLAWHUB_API_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_API_TOKEN" ]; then
            echo "::error::Missing required secret CLAWHUB_API_TOKEN"
            exit 1
          fi
          bunx --bun clawhub@latest login --token "$CLAWHUB_API_TOKEN" --no-browser

      - name: Verify ClawHub authentication
        if: steps.guard.outputs.publish == 'true'
        run: bunx --bun clawhub@latest whoami

      - name: Publish package to ClawHub
        if: steps.guard.outputs.publish == 'true'
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # The publish is made idempotent HERE, not in the pre-flight guard,
        # because the collision this recovers from happens INSIDE the publish
        # command. Observed on run 31523895558: the guard correctly saw no
        # 0.15.9 at 18:40:36, the registry gained 0.15.9 at 18:42:39, and the
        # same command then exited 1 with "already exists" at 18:44:32 - two
        # ~2-minute gaps, i.e. a client-side timeout and a silent retry racing
        # its own successful first attempt. The package was live and tagged
        # `latest`; only the job was red.
        #
        # So: on failure, ask the registry whether OUR version is now present.
        # If it is, the desired end state was reached and the run is green. Any
        # other failure still fails. This cannot mask a genuine error - it only
        # passes when the exact version we set out to publish exists.
        run: |
          set -uo pipefail
          if bunx --bun clawhub@latest package publish "${{ steps.pack.outputs.publish_path }}" \
              --family code-plugin \
              --owner clawbits \
              --tags latest,clawbits \
              --topics clawbits \
              --source-repo "${{ github.repository }}" \
              --source-commit "$SOURCE_SHA" \
              --source-ref "$SOURCE_REF"; then
            echo "Published $VERSION"
            exit 0
          fi
          echo "::warning::publish exited non-zero; checking whether $VERSION landed anyway"
          versions_json="$(curl -fsS "https://clawhub.ai/api/v1/packages/clawbits-openclaw-plugin/versions" || true)"
          if [ -z "$versions_json" ]; then
            echo "::error::publish failed and the registry could not be reached to confirm"
            exit 1
          fi
          landed="$(node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            console.log((data.items || []).map(x => x.version).includes(process.argv[1]) ? 'true' : 'false');
          " "$VERSION" <<<"$versions_json")"
          if [ "$landed" = "true" ]; then
            echo "::notice::$VERSION is on the registry despite the non-zero exit (retry raced itself); treating as success."
            exit 0
          fi
          echo "::error::publish failed and $VERSION is NOT on the registry"
          exit 1
