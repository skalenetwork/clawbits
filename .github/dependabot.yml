# Dependency updates. Grouped and weekly on purpose: this is a monorepo with
# eight manifests across four ecosystems, and ungrouped daily PRs would bury
# real review. Security updates ignore the schedule and open immediately.
version: 2

updates:
  # ── Python (uv) ─────────────────────────────────────────────────────────────
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # semantic-router pulls litellm transitively; >=1.92 ships only an sdist
      # whose Rust bridge cannot build on Python 3.14. See pyproject.toml's
      # [tool.uv] note — the cap is load-bearing, not laziness.
      - dependency-name: litellm
        versions: [">=1.92"]

  # ── JavaScript / TypeScript (bun lockfiles) ─────────────────────────────────
  # One entry per workspace: they have independent lockfiles and are built by
  # separate CI jobs, so a shared PR would be unreviewable.
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore", include: scope }
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore", include: scope }
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /plugin
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore", include: scope }
    groups:
      plugin-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /reef/admin-ui
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore", include: scope }
    groups:
      admin-ui-minor-patch:
        update-types: [minor, patch]

  # Expo pins its own dependency set per SDK release; bumping individual
  # packages outside an `expo install` breaks the native build. Majors only,
  # so an SDK upgrade is a deliberate PR.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore", include: scope }
    ignore:
      - dependency-name: "expo*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "react-native*"
        update-types: [version-update:semver-minor, version-update:semver-patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore", include: scope }
    groups:
      desktop-minor-patch:
        update-types: [minor, patch]

  # ── Rust ────────────────────────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore", include: scope }
    groups:
      tauri-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /ironclaw-channel
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore", include: scope }
    groups:
      ironclaw-channel-minor-patch:
        update-types: [minor, patch]

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore", include: scope }
    groups:
      actions:
        patterns: ["*"]
