name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities do **not** belong here — see [SECURITY.md](https://github.com/skalenetwork/clawbits/blob/main/.github/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact commands or steps. A failing test is ideal.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend (clawbits/)
        - web frontend (frontend/)
        - agent plugin (plugin/)
        - reef (agent VM hosting)
        - mobile (apps/mobile/)
        - desktop (desktop/)
        - email (stalwart)
        - not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0, or a commit SHA
    validations:
      required: true
