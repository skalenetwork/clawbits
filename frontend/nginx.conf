server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history routing: unknown paths fall back to index.html.
    # index.html is revalidated on every load so the latest /assets hashes are picked up.
    #
    # The CSP is the SPA's own document policy, so it lives here and never
    # reaches /api/ (the desktop OAuth callback page there has inline code).
    # Loosened only where the app needs it: 'wasm-unsafe-eval' for Shiki's
    # Oniguruma engine; 'unsafe-inline' styles for Shiki token colors, the
    # email srcdoc frame (it inherits this policy) and library-injected
    # <style>; data: fonts for the subsets Vite inlines under its 4 KB
    # limit; https: images for link previews; blob: frames for PDFs;
    # R2 presigned URLs for uploads, previews and video; Umami on prod only.
    # Mirrored for the desktop app in desktop/src-tauri/tauri.conf.json.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src blob: https://*.r2.cloudflarestorage.com; connect-src 'self' https://*.r2.cloudflarestorage.com https://gateway.umami.is; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
