server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history routing: unknown paths fall back to index.html.
    # index.html is revalidated on every load so the latest /assets hashes are picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
