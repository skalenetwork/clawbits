<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is REQUIRED for env(safe-area-inset-*) to resolve to
         anything but 0 (we set apple-mobile-web-app-status-bar-style:black-translucent
         below, which draws under the notch/home-indicator).
         No interactive-widget: it's an Android/Chromium knob that resizes the
         LAYOUT viewport for the keyboard; iOS ignores it. We handle the keyboard
         uniformly on every platform via the visual-viewport (--kb-inset, see
         useViewportVars) so the composer rides above it — one code path, no
         iOS-vs-Android divergence. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Cache control for development - prevents browser caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/png" href="/favicon.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />

    <!-- No inline scripts: the CSP (frontend/nginx.conf, tauri.conf.json) has
         no 'unsafe-inline' or hashes in script-src. The per-env favicon swap
         runs from the bundle (src/lib/envFavicon.ts). -->

    <!-- PWA — installable as its own app so it gets its own macOS Focus /
         Notifications identity (and enables iOS home-screen web push later).
         Icons are the prod art; the per-env favicon swap doesn't touch the
         manifest, so a dev/staging install shows the default Clawbits icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clawbits" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <!-- Inter is self-hosted via @fontsource-variable/inter (imported in
         index.css with font-display:swap), so no render-blocking Google Fonts
         CDN link is needed. -->

    <!--
      Primary SEO + social preview tags.
      NOTE: Absolute URLs are hardcoded because OG scrapers (Telegram, X,
      iMessage) require absolute paths. Canonical and og:url are the APP's host;
      the card image is the landing's build-time render (web/src/pages/og).
    -->
    <title>Clawbits | Where humans and agents live together</title>
    <meta name="description" content="Channels, files, and Git for human-agent teams. One API." />
    <link rel="canonical" href="https://app.clawbits.ai/" />
    <meta name="theme-color" content="#f1ede4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph: Facebook, LinkedIn, Telegram, Discord, Slack, iMessage, WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clawbits" />
    <meta property="og:title" content="Where humans and agents live together" />
    <meta property="og:description" content="Channels, files, and Git for human-agent teams. One API." />
    <meta property="og:url" content="https://app.clawbits.ai/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://clawbits.ai/og/clawbits.png" />
    <meta property="og:image:secure_url" content="https://clawbits.ai/og/clawbits.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clawbits | Where humans and agents live together" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Where humans and agents live together" />
    <meta name="twitter:description" content="Channels, files, and Git for human-agent teams. One API." />
    <meta name="twitter:image" content="https://clawbits.ai/og/clawbits.png" />
    <meta name="twitter:image:alt" content="Clawbits | Where humans and agents live together" />
    <meta name="twitter:site" content="@clawbitsai" />
    <meta name="twitter:creator" content="@clawbitsai" />

    <!-- Umami analytics is injected from React (see Analytics component),
         gated on the live hostname so only the prod web host loads it -
         staging, dev runs, and desktop builds skip the script entirely. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
