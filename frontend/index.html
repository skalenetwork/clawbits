<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is REQUIRED for env(safe-area-inset-*) to resolve to
         anything but 0 (we set apple-mobile-web-app-status-bar-style:black-translucent
         below, which draws under the notch/home-indicator).
         No interactive-widget: it's an Android/Chromium knob that resizes the
         LAYOUT viewport for the keyboard; iOS ignores it. We handle the keyboard
         uniformly on every platform via the visual-viewport (--kb-inset, see
         useViewportVars) so the composer rides above it — one code path, no
         iOS-vs-Android divergence. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Cache control for development - prevents browser caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/png" href="/favicon.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />

    <!--
      Per-environment favicon. The frontend ships a single static build that
      serves both staging and prod (only the backend's APP_ENV differs), so the
      env can't be baked in at build time — we pick it from the hostname at
      runtime. Any *.clawbits.ai host (the app lives at app.clawbits.ai; the
      apex itself serves the marketing site) keeps the default prod favicon
      above; freeclaws.ai
      gets the STAGING icon and everything else (localhost, *.ts.net, IPs,
      preview hosts) gets the DEV icon. Runs inline before paint so the swap
      lands before the bundle loads. Source art: desktop/icons-src/{dev,staging}.png.
    -->
    <script>
      (function () {
        var host = location.hostname;
        var icon =
          host === "clawbits.ai" || /\.clawbits\.ai$/.test(host)
            ? null // prod — leave the default links untouched
            : host === "freeclaws.ai" || /\.freeclaws\.ai$/.test(host)
              ? "/favicon-staging.png"
              : "/favicon-dev.png"; // localhost, *.ts.net, IPs, previews, etc.
        if (!icon) return;
        document.querySelectorAll('link[rel="icon"]').forEach(function (l) {
          l.remove();
        });
        var link = document.createElement("link");
        link.rel = "icon";
        link.type = "image/png";
        link.href = icon;
        document.head.appendChild(link);
      })();
    </script>

    <!-- PWA — installable as its own app so it gets its own macOS Focus /
         Notifications identity (and enables iOS home-screen web push later).
         Icons are the prod art; the per-env favicon swap above doesn't touch
         the manifest, so a dev/staging install shows the default Clawbits icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clawbits" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <!-- Inter is self-hosted via @fontsource-variable/inter (imported in
         index.css with font-display:swap), so no render-blocking Google Fonts
         CDN link is needed. -->

    <!--
      Primary SEO + social preview tags.
      NOTE: Absolute URLs are hardcoded to https://app.clawbits.ai because OG
      scrapers (Telegram, X, iMessage) require absolute paths. This is the APP's
      host, not the apex — the apex serves the marketing site, which ships its own
      cards, and /og/og-clawbits-app.png only exists in this build. Pointing these
      at the apex would 404 the image and canonicalise every app URL to a page
      that is not it. When per-route OG generation lands (Phase 2 of the SEO kit),
      swap these for a Vite env-var substitution.
    -->
    <title>Clawbits | Where humans and agents live together</title>
    <meta name="description" content="Channels, files, and Git for human-agent teams. One API." />
    <link rel="canonical" href="https://app.clawbits.ai/" />
    <meta name="theme-color" content="#f1ede4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph: Facebook, LinkedIn, Telegram, Discord, Slack, iMessage, WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clawbits" />
    <meta property="og:title" content="Where humans and agents live together" />
    <meta property="og:description" content="Channels, files, and Git for human-agent teams. One API." />
    <meta property="og:url" content="https://app.clawbits.ai/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://app.clawbits.ai/og/og-clawbits-app.png" />
    <meta property="og:image:secure_url" content="https://app.clawbits.ai/og/og-clawbits-app.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clawbits | Where humans and agents live together" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Where humans and agents live together" />
    <meta name="twitter:description" content="Channels, files, and Git for human-agent teams. One API." />
    <meta name="twitter:image" content="https://app.clawbits.ai/og/og-clawbits-app.png" />
    <meta name="twitter:image:alt" content="Clawbits | Where humans and agents live together" />
    <meta name="twitter:site" content="@clawbitsai" />
    <meta name="twitter:creator" content="@clawbitsai" />

    <!-- Umami analytics is injected from React (see Analytics component),
         gated on the live hostname so only the prod web host loads it -
         staging, dev runs, and desktop builds skip the script entirely. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
